version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dz_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dz_user}:${POSTGRES_PASSWORD:-dz_pass}@db:5432/${POSTGRES_DB:-dz_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dz_network

  db:
    image: postgres:15-alpine
    container_name: dz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dz_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dz_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dz_user} -d ${POSTGRES_DB:-dz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dz_network

  redis:
    image: redis:7-alpine
    container_name: dz_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dz_network

volumes:
  pgdata:
  redisdata:

networks:
  dz_network:
    driver: bridge
